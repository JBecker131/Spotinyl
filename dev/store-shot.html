<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spotinyl — store screenshot</title>
    <link rel="stylesheet" href="../src/shared/fonts.css" />
    <link rel="stylesheet" href="../src/popup/popup.css" />
    <style>
      /* popup.css pins the body to the popup's own 360px; this page is a stage. */
      html, body {
        width: auto;
        margin: 0;
        padding: 0;
        background: #100c09;
        overflow: hidden;
      }

      /* Exactly the size the Chrome Web Store accepts. Screenshot this element,
         or the viewport with the window sized to match. */
      .stage {
        width: 1280px;
        height: 800px;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 80px;
        padding: 0 96px;
        background:
          radial-gradient(120% 90% at 12% 0%, #46301f 0%, transparent 60%),
          radial-gradient(100% 80% at 100% 100%, #2c1d12 0%, transparent 55%),
          #1a120c;
      }

      .pitch { max-width: 460px; color: #efe7d8; }

      .pitch__mark {
        font-family: "Memory of 2018", "Helvetica Neue", Arial, sans-serif;
        font-size: 60px;
        line-height: 1;
        margin: 0 0 22px;
        color: #efe7d8;
      }

      .pitch__line {
        font-family: "Helvetica Neue", Arial, sans-serif;
        font-size: 27px;
        font-weight: 400;
        line-height: 1.35;
        letter-spacing: -0.01em;
        margin: 0 0 26px;
        color: #f4ecdd;
      }

      .pitch__sub {
        font-family: "Helvetica Neue", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        margin: 0;
        color: #b3a189;
      }

      /* The popup is 360px wide for real; enlarge it so it reads at 1280px.
         `zoom` rather than `transform: scale`, so the deck's layout box grows
         with it and the grid column reserves the room it actually occupies. */
      .frame { width: 360px; zoom: 1.62; }
      .frame .deck { background: linear-gradient(160deg, #4a3120, #2a1a10); }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="pitch">
        <p class="pitch__mark">Spotinyl</p>
        <p class="pitch__line">A turntable for your Spotify playback, in the toolbar.</p>
        <p class="pitch__sub">
          See what is spinning, drop the needle, skip, and set the volume &mdash;
          without leaving the tab you are on.
        </p>
      </div>
      <div class="frame" id="frame"></div>
    </div>

    <script type="module">
      import { render } from '../src/popup/render.js';
      import { STATUS } from '../src/lib/player-state.js';

      // --- Edit these to change what the screenshot shows ----------------
      const TITLE = 'Earrings';
      const ARTIST = 'Malcolm Todd';
      const ELAPSED_MS = 72_000;
      const LENGTH_MS = 161_000;
      const VOLUME = 62;

      // The sleeve, served from the project's assets folder.
      const ART_URL = '../assets/Sweet%20Boy%20Cover.webp';

      // ------------------------------------------------------------------

      const state = {
        status: STATUS.READY,
        track: {
          id: 'shot',
          title: TITLE,
          artist: ARTIST,
          album: '',
          artUrl: ART_URL,
          durationMs: LENGTH_MS,
        },
        isPlaying: true,
        progressMs: ELAPSED_MS,
        durationMs: LENGTH_MS,
        volumePercent: VOLUME,
        deviceId: 'SHOT',
        canSetVolume: true,
        fetchedAt: Date.now(),
        message: '',
      };

      // Reuse the real popup markup so the shot cannot drift from the product.
      const template = await fetch('../src/popup/popup.html').then((r) => r.text());
      const deck = new DOMParser().parseFromString(template, 'text/html').querySelector('.deck');
      document.getElementById('frame').append(deck);
      render(deck, state);

      // The sleeve is deliberately kept out of git, so a fresh clone has no file
      // at ART_URL. Fall back to a plain label rather than an empty hole.
      const art = deck.querySelector('.record__art');
      art.addEventListener('error', () => {
        art.src = 'data:image/svg+xml,' + encodeURIComponent(
          `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
             <defs>
               <radialGradient id="f" cx="0.35" cy="0.3" r="0.85">
                 <stop offset="0" stop-color="#f0b45a"/>
                 <stop offset="1" stop-color="#8c3b1f"/>
               </radialGradient>
             </defs>
             <rect width="300" height="300" fill="url(#f)"/>
           </svg>`);
      });
    </script>
  </body>
</html>
